<style>
  /* ── Scoped to #certifications-section ── */
  #certifications-section * { box-sizing: border-box; }

  .ts-photo-card {

  .ts-photo-card img {

    object-fit: cover;
    display: block;
    filter: grayscale(1) brightness(0.77);
    transition: filter 0.5s ease;
  }
  .ts-photo-card.ts-active img   { filter: grayscale(0) brightness(1); }
  .ts-photo-card.ts-dimmed       { opacity: 0.6; }

  .ts-member-row {
    cursor: pointer;
    transition: opacity 0.3s ease;
  }
  .ts-member-row.ts-dimmed { opacity: 0.5; }

  .ts-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ts-dot {
    display: inline-block;
    width: 16px;
    height: 12px;
    border-radius: 5px;
    background: rgba(0,0,0,0.25);
    flex-shrink: 0;
    transition: background 0.3s ease, width 0.3s ease;
  }
  .ts-member-row.ts-active .ts-dot {
    background: #111;
    width: 20px;
  }

  .ts-name {
    font-size: 18px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    color: rgba(0,0,0,0.8);
    transition: color 0.3s ease;
  }
  .ts-member-row.ts-active .ts-name { color: #111; }

  .ts-socials {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: 2px;
    opacity: 0;
    transform: translateX(-8px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .ts-member-row.ts-active .ts-socials {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .ts-social-link {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    border-radius: 4px;
    color: #888;
    text-decoration: none;
    transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .ts-social-link:hover {
    color: #111;
    background: rgba(0,0,0,0.08);
    transform: scale(1.1);
  }

  .ts-role {
    margin: 6px 0 0 27px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #888;
  }

  /* ── Responsive: side-by-side on tablet+ ── */
  @media (min-width: 768px) {
    #team-showcase {
      flex-direction: row !important;
      align-items: flex-start;
      gap: 56px !important;
    }
    #member-list {
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      align-content: start;
      padding-top: 8px;
    }
  }
  @media (max-width: 640px) {
    .ts-photo-card[style*="width:155px"] { width: 110px !important; height: 120px !important; }
    .ts-photo-card[style*="width:172px"] { width: 122px !important; height: 132px !important; }
    .ts-photo-card[style*="width:162px"] { width: 115px !important; height: 125px !important; }
    .ts-col[style*="margin-top: 68px"]   { margin-top: 48px !important; }
    .ts-col[style*="margin-top: 32px"]   { margin-top: 22px !important; }
    .ts-name { font-size: 15px; }
  }
</style>

<script>
(function () {
  var hovered = null;

  var photos  = document.querySelectorAll('.ts-photo-card');
  var members = document.querySelectorAll('.ts-member-row');

  function activate(id) {
    hovered = id;
    photos.forEach(function (el) {
      var elId = el.getAttribute('data-id');
      el.classList.toggle('ts-active',  elId === id);
      el.classList.toggle('ts-dimmed',  id !== null && elId !== id);
    });
    members.forEach(function (el) {
      var elId = el.getAttribute('data-id');
      el.classList.toggle('ts-active',  elId === id);
      el.classList.toggle('ts-dimmed',  id !== null && elId !== id);
    });
  }

  function deactivate() {
    hovered = null;
    photos.forEach(function (el) {
      el.classList.remove('ts-active', 'ts-dimmed');
    });
    members.forEach(function (el) {
      el.classList.remove('ts-active', 'ts-dimmed');
    });
  }

  photos.forEach(function (el) {
    el.addEventListener('mouseenter', function () { activate(el.getAttribute('data-id')); });
    el.addEventListener('mouseleave', deactivate);
  });

  members.forEach(function (el) {
    el.addEventListener('mouseenter', function () { activate(el.getAttribute('data-id')); });
    el.addEventListener('mouseleave', deactivate);
  });
})();
</script>
